services:
  - type: web
    name: grain-transport-platform
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: grain-transport-db
          property: connectionString
      - key: ROUTE_TOKEN_SECRET
        generateValue: true
databases:
  - name: grain-transport-db
    databaseName: grain_transport
    user: grain
    plan: free
